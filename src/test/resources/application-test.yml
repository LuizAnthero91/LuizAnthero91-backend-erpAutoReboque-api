spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/erp_autoreboque_test
    username: erp_autoreboque_app
    password: ${TEST_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  # SMTP fictício apenas para o contexto de testes
  mail:
    host: localhost
    port: 2525
    username: teste
    password: teste

app:
  frontend-url: http://localhost:4200

  mail:
    from: teste@localhost

jwt:
  secret: ${TEST_JWT_SECRET}
  expiration: 3600000

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false