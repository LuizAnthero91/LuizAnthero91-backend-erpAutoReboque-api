spring:
  datasource:
    url: jdbc:h2:mem:erp_autoreboque_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

  # SMTP fictício apenas para o contexto de testes
  mail:
    host: localhost
    port: 2525
    username: teste
    password: teste

app:
  frontend-url: http://localhost:4200

  mail:
    from: teste@localhost

jwt:
  secret: 0123456789012345678901234567890123456789012345678901234567890123
  expiration: 3600000

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

storage:
  r2:
    endpoint: http://localhost:9000
    bucket: test-bucket
    access-key: test-access-key
    secret-key: test-secret-key