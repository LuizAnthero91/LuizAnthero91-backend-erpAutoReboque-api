server:
  port: 8080

spring:
  application:
    name: autoreboque-tora

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erplcdigitaltec}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  password-reset:
    expose-token: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000