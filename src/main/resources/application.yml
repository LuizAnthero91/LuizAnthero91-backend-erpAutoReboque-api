server:
  port: 8080

spring:
  application:
    name: autoreboque-tora

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erplcdigitaltec}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.titan.email}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

  mail:
    from: ${MAIL_FROM:nao-responda@lcdigitaltec.com.br}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000