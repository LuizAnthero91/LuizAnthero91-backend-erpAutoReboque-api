name: ERP Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: erp_autoreboque_test
          POSTGRES_USER: erp_autoreboque_app
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U erp_autoreboque_app -d erp_autoreboque_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

    steps:

      - name: Baixar codigo
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permissao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar build e testes
        run: ./mvnw --batch-mode clean package

      - name: Salvar JAR como artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: erp-autoreboque-api
          path: target/*.jar
          retention-days: 5



  deploy-staging-vps:
    name: Enviar JAR para VPS
    runs-on: ubuntu-latest

    needs:
      - build-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Baixar JAR aprovado
        uses: actions/download-artifact@v4
        with:
          name: erp-autoreboque-api
          path: artifact

      - name: Configurar chave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Registrar VPS em known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Enviar JAR para /tmp da VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp \
            -P "$VPS_PORT" \
            artifact/*.jar \
            "$VPS_USER@$VPS_HOST:/tmp/erp-autoreboque-app.jar"