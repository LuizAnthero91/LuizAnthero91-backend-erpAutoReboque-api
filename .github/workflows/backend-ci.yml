name: ERP Backend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: erp_autoreboque_test
          POSTGRES_USER: erp_autoreboque_app
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U erp_autoreboque_app -d erp_autoreboque_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permissao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar build e testes
        run: ./mvnw --batch-mode clean package


  deploy-staging-vps:
    name: Deploy Docker na VPS
    runs-on: ubuntu-latest

    needs:
      - build-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configurar chave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Registrar VPS em known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Atualizar e publicar backend Docker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" << 'EOF'

          set -e

          cd /opt/repos/LuizAnthero91-backend-erpAutoReboque-api

          echo "=========================================="
          echo "Atualizando repositorio"
          echo "=========================================="

          git fetch origin
          git reset --hard origin/main

          echo "Commit em producao:"
          git log -1 --oneline

          echo "=========================================="
          echo "Construindo nova imagem Docker"
          echo "=========================================="

          docker compose -f docker-compose.yml build erp

          echo "=========================================="
          echo "Subindo novo container"
          echo "=========================================="

          docker compose -f docker-compose.yml up -d erp

          echo "=========================================="
          echo "Validando container"
          echo "=========================================="

          docker compose -f docker-compose.yml ps

          if ! docker ps \
            --format '{{.Names}}' \
            | grep -q '^erpautoreboque-tora$'; then

            echo "ERRO: container nao esta em execucao."

            docker logs \
              --tail 100 \
              erpautoreboque-tora || true

            exit 1
          fi

          echo "=========================================="
          echo "Validando Spring Boot via HTTP"
          echo "=========================================="

          HEALTH_OK=false

          for tentativa in {1..12}; do

            HTTP_STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://127.0.0.1:8080/ || true)

            echo "Tentativa $tentativa/12 - HTTP $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "401" ]; then
              HEALTH_OK=true
              break
            fi

            sleep 5
          done

          if [ "$HEALTH_OK" != "true" ]; then

            echo "=========================================="
            echo "ERRO: Spring Boot nao respondeu corretamente"
            echo "=========================================="

            echo "Status Docker:"
            docker compose -f docker-compose.yml ps

            echo "Ultimos logs:"
            docker logs \
              --tail 100 \
              erpautoreboque-tora || true

            exit 1
          fi

          echo "=========================================="
          echo "Spring Boot respondeu HTTP 401"
          echo "DEPLOY CONCLUIDO COM SUCESSO"
          echo "=========================================="

          EOF